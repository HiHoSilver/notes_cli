[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes_cli"
version = "0.1.0"
description = "A simple note-taking CLI tool."
authors = [{ name = "Nicholas Silver" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
notes = "notes_cli.main:main"
